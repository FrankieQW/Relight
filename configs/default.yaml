project:
  # Relative to this config file; the parent of `datacompose/` in the default
  # layout. `paths.*` are resolved against it (absolute values are allowed).
  root: ..
  schema_version: "1.0"
  seed: 20260810

paths:
  # --- scenes -------------------------------------------------------------
  scene_root: data/scene
  scene_output: data/scene/scene.json
  # Must stay inside project.root: scene fragments record their blend with a
  # path relative to it.
  scene_cache: data/cache/scenes
  scene_review_jsonl: outputs/reports/scene_group_review.jsonl
  scene_review_html: outputs/reports/scene_group_review.html
  scene_review_assets: outputs/reports/scene_group_review_assets

  # --- scene cameras + renders -------------------------------------------
  render_jobs_output: outputs/manifests/scene_camera_jobs.jsonl
  render_jobs_summary: outputs/manifests/scene_camera_jobs.summary.json
  render_job_rejects: outputs/reports/scene_camera_rejects.jsonl
  tokenlight_output: outputs/tokenlight_dataset

scene:
  blender_bin: /opt/blender-4.5/blender
  expected_blender_major_minor: "4.5"
  allow_blender_version_mismatch: false
  fbx_glob: "**/*.fbx"
  workers: 1
  resume: true
  id_hash_length: 16
  aliases_file: configs/category_aliases.yaml
  overrides_file: configs/scene_overrides.yaml
  render_review_images: false
  review_random_fraction: 0.10
  review_minimum_per_scene: 100
  review_frequent_minimum: 20
  low_confidence_threshold: 0.90
  render_review_categories: []
  # Entities that provide a stable top surface (kept for review labels and for
  # "what can be stood on" checks in planning).
  support_categories:
    - bar
    - bench
    - cabinet
    - counter
    - desk
    - floor
    - shelf
    - stool
    - table
  # Entities that are architectural structure and must never be flagged as
  # replaceable (kept so the scene graph stays a faithful description).
  non_replaceable_categories:
    - building
    - ceiling
    - floor
    - road
    - sidewalk
    - sky
    - wall
    - window
  frequent_review_categories:
    - beer_glass
    - bottle
    - chair
    - cutlery
    - plate
    - table
    - water_glass
    - wine_glass

m4:
  blender_bin: /opt/blender-4.5/blender
  license_policy_version: unconfigured
  base_scene_license:
    name: null
    source_uri: null
    attribution: null
    decision: unverified

  # Camera planning (plan_scene_cameras.py). Thresholds are mirrored in the
  # Blender worker, which re-validates every pose against real triangles.
  cameras_per_scene: 32
  camera:
    focal_length: 50.0
    yaw_degrees: [0.0, 360.0]
    pitch_degrees: [-18.0, 12.0]
    eye_height: [1.10, 1.80]
    height_policy: floor_standing
    camera_radius: 0.20
    near_clearance: 0.30
    max_depth: 45.0
    ray_grid: 24
    search_ray_grid: 12
    min_hit_fraction: 0.90
    near_window: 1.00
    max_near_fraction: 0.25
    max_single_node_fraction: 0.90
    min_depth_spread_ratio: 1.35
    attempts_per_camera: 32
    min_camera_spacing: 1.50
  # Entities treated as scene-native light fixtures when in view.
  fixture_categories: [lamp, lantern, light, chandelier, sconce]
  camera_gate:
    camera_radius: 0.20
    near_clearance: 0.30
    ray_grid: 16
    max_depth: 45.0
    min_hit_fraction: 0.90
    max_near_fraction: 0.25
    near_window: 1.00
    max_single_object_fraction: 0.90
    min_depth_spread_ratio: 1.35
  max_render_jobs: null

  render_gpu_ids: [0]
  render_workers: 1
  overwrite: false
  render:
    resolution: 512
    engine: CYCLES
    samples: 64
    denoise: true
    persistent_data: false
    threads_per_worker: auto
    device: GPU
    compute_device_type: CUDA
    require_gpu: true
    # Ambient light: point this at a directory of .hdr/.exr files (each sample
    # picks one deterministically) or leave null for a constant world colour.
    hdri_root: null
    ambient_world_strength: 1.0
    ambient_world_color: [0.18, 0.18, 0.18, 1.0]
    # Point/area light offsets are fractions of the framed depth, so the rig
    # scales with the room instead of collapsing into the camera.
    point_lights_per_scene: 16
    point_energy: 500.0
    point_position_ranges:
      x: [-0.6, 0.6]
      y: [0.25, 0.75]
      z: [-0.4, 0.4]
    point_radius_range: [0.03, 0.25]
    diffuse_sizes: [0.05, 0.2, 0.4, 0.7, 1.0, 1.5]
    diffuse_position: [0.0, 0.25, 0.35]
    fixture_energy: 300.0
    fixture_light_radius: 0.12
    fallback_emission_strength: 4.0
    passes:
      enabled: false
      albedo: true
      normal: true
      irradiance: true
      irradiance_mode: derived
      normal_space: camera
      save_normal_world: false
      pass_samples: 1
      eps: 0.001
      denoise_passes: false
      require_textures: false
      min_base_color_linked_ratio: 0.9
      max_magenta_ratio: 0.0001
  fixture:
    minimum_visible_pixels: 64
    maximum_screen_fraction: 0.05
    # Fallback emitter offsets are fractions of the framed depth.
    fallback_candidates: 24
    fallback_fixture_size_ratio: 0.10
    fallback_fixture_size_min: 0.02
    fallback_fixture_size_max: 0.25
    fallback_position_ranges:
      x: [-0.4, 0.4]
      y: [0.3, 0.8]
      z: [-0.3, 0.3]
